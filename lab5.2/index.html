<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5.2 - CSS Transform, Transition, Animation & Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= BÀI 1: TRANFORM, TRANSITION & ANIMATION ================= -->
    <div class="lab52-section">
        <h2 class="section-heading">Bài 1: Ứng dụng Transform, Transition & Animation</h2>
        
        <!-- Banner trà với hình ảnh thực tế và hiệu ứng animation giống đề bài -->
        <div class="tea-hero-banner">
            <h3 class="subtitle heading_first--animation">Over one hundred flavors of tea</h3>
            <h1 class="main-title heading_primary">SPECIALLY CRAFTED TEA</h1>
            <a href="#" class="btn-explore header_btn">EXPLORE</a>
        </div>

        <!-- Menu demo (Transition & Transform link) -->
        <div class="menu-demo">
            <a href="#" class="nav_link">FEATURES</a>
            <a href="#" class="nav_link">ABOUT</a>
            <a href="#" class="nav_link">PRODUCTS</a>
            <a href="#" class="nav_link">SERVICES</a>
            <a href="#" class="nav_link">CONTACTS</a>
        </div>

        <!-- Hiệu ứng zoom ảnh khi hover (Màn hình 3) -->
        <div class="about_left">
            <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?q=80&w=800&auto=format&fit=crop" alt="About Us" class="about_img">
        </div>
    </div>

    <!-- ================= BÀI 2: ỨNG DỤNG CSS FLEXBOX ================= -->
    <div class="lab52-section">
        <h2 class="section-heading">Bài 2: Ứng dụng CSS Flexbox</h2>
        <div class="flex-banner">
            <div class="flex-item item-1">1</div>
            <div class="flex-item item-2">2</div>
            <div class="flex-item item-3">3</div>
            <div class="flex-item item-4">4</div>
            <div class="flex-item item-5">5</div>
            <div class="flex-item item-6">6</div>
        </div>
    </div>

    <!-- ================= BÀI 3: GIAO DIỆN PAGE TITLE ================= -->
    <div class="lab52-section">
        <h2 class="section-heading">Bài 3: Giao diện Page Title (GV cho thêm)</h2>
        <div class="page-title-banner">
            <h1 class="page-title-text">PAGE TITLE</h1>
        </div>
    </div>

</html>
